global:
  resolve_timeout: 5m
route:
  group_by: ['alertname', 'namespace', 'pod']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram-notifications'
receivers:
  - name: 'telegram-notifications'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token: '9066749143:AAGHTyeAgkLeziJPyAxQAKwJAfN7CqDNMCY'
        chat_id: 8790380429
        send_resolved: true
        parse_mode: 'HTML'
        message: |-
          🚨 <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          <b>Service/Pod:</b> <code>{{ .Labels.pod }}</code>
          <b>Namespace:</b> <code>{{ .Labels.namespace }}</code>
          <b>Mức độ:</b> <code>{{ .Labels.severity }}</code>
          <b>Chi tiết:</b> {{ .Annotations.description }}
          {{ end }}
