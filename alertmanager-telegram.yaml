alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'pod']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'telegram-notifications'
    receivers:
      - name: 'telegram-notifications'
        telegram_configs:
          - api_url: 'https://api.telegram.org'
            bot_token: '9066749143:AAGHTyeAgkLeziJPyAxQAKwJAfN7CqDNMCY'
            chat_id: 8790380429
            send_resolved: true
            parse_mode: 'HTML'
            message: |-
              🚨 <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
              {{ range .Alerts }}
              <b>Service/Pod:</b> <code>{{ .Labels.pod }}</code>
              <b>Namespace:</b> <code>{{ .Labels.namespace }}</code>
              <b>Mức độ:</b> <code>{{ .Labels.severity }}</code>
              <b>Chi tiết:</b> {{ .Annotations.description }}
              {{ end }}

additionalPrometheusRulesMap:
  microservices-alerts:
    groups:
      - name: microservices.rules
        rules:
          - alert: ServiceHighCPU
            expr: sum(rate(container_cpu_usage_seconds_total{container!=""}[2m])) by (pod, namespace) > 0.8
            for: 1m
            labels:
              severity: warning
            annotations:
              description: "Pod {{ $labels.pod }} đang dùng quá 80% CPU."
          - alert: ServiceHighMemory
            expr: sum(container_memory_working_set_bytes{container!=""}) by (pod, namespace) / 1024 / 1024 > 500
            for: 1m
            labels:
              severity: warning
            annotations:
              description: "Pod {{ $labels.pod }} ngốn vượt 500MB RAM."
          - alert: ServiceHighErrorRate
            expr: (sum(rate(http_requests_total{status=~"5.."}[1m])) by (pod, namespace) / sum(rate(http_requests_total[1m])) by (pod, namespace)) * 100 > 5
            for: 1m
            labels:
              severity: critical
            annotations:
              description: "Tỷ lệ lỗi HTTP 5xx của {{ $labels.pod }} vượt quá 5%."
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, pod, namespace)) > 1.0
            for: 1m
            labels:
              severity: warning
            annotations:
              description: "Độ trễ P95 của {{ $labels.pod }} vượt quá 1 giây."
