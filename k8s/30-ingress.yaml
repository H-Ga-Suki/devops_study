apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  namespace: shop
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["shop.172.198.139.227.nip.io"]
      secretName: shop-tls
  rules:
    - host: shop.172.198.139.227.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: gateway, port: {number: 3000}}
