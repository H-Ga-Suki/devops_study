apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway, color: blue}}
  template:
    metadata: {labels: {app: gateway, color: blue}}
    spec:
      containers:
        - name: gateway
          image: phngoccong/gateway:latest
          ports: [{containerPort: 3000}]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
---
apiVersion: apps/v1
kind: Deployment
