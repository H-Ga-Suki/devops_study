# ---------- payment-db (Postgres) ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: payment-data, namespace: shop}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-db, namespace: shop}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: payment-db}}
  template:
    metadata: {labels: {app: payment-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: app-config, key: PAYMENT_DB_NAME}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            initialDelaySeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: payment-data}
---
apiVersion: v1
kind: Service
metadata: {name: payment-db, namespace: shop}
spec:
  selector: {app: payment-db}
  ports: [{port: 5432}]
---
