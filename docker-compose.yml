services:
  # --- MESSAGE BROKER ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: devops_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - devops-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # --- DATABASES ---
  product-db:
    image: mongo:latest
    container_name: product_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - product_data:/data/db
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u ${MONGO_INITDB_ROOT_USERNAME} -p ${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  order-db:
    image: postgres:15-alpine
    container_name: order_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDER_DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  cart-db:
    image: redis:7-alpine
    container_name: cart_db
    ports:
      - "6379:6379"
    volumes:
      - cart_data:/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-db:
    image: postgres:15-alpine
    container_name: payment_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PAYMENT_DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

 # --- MICROSERVICES ---
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: gateway_service
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: ${PORT_GATEWAY}
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - devops-net

  product-service:
    build:
      context: ./apps/product
      dockerfile: Dockerfile
    container_name: product_service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: ${PORT_PRODUCT}
      DB_URI: ${DB_URI_PRODUCT}
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devops-net

  cart-service:
    build:
      context: ./apps/cart
      dockerfile: Dockerfile
    container_name: cart_service
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      PORT: ${PORT_CART}
      DB_URI: ${DB_URI_CART}
    depends_on:
      cart-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devops-net

  order-service:
    build:
      context: ./apps/order
      dockerfile: Dockerfile
    container_name: order_service
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      PORT: ${PORT_ORDER}
      DB_URI: ${DB_URI_ORDER}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devops-net

  payment-service:
    build:
      context: ./apps/payment
      dockerfile: Dockerfile
    container_name: payment_service
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      PORT: ${PORT_PAYMENT}
      DB_URI: ${DB_URI_PAYMENT}
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - devops-net

volumes:
  product_data:
  order_data:
  cart_data:
  payment_data:

networks:
  devops-net:
    driver: bridge