---
- name: Kiem tra K3s da cai chua
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Tai script cai K3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_bin.stat.exists

- name: Cai K3s
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
    K3S_KUBECONFIG_MODE: "644"
  changed_when: true
  when: not k3s_bin.stat.exists

- name: Bat dich vu K3s
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Mo cac cong K3s
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "6443", proto: tcp }
    - { port: "10250", proto: tcp }
    - { port: "8472", proto: udp }
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
