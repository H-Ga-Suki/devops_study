---
- name: Cai goi phu thuoc
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Tao thu muc keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Tai GPG key cua Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Them repo Docker
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Cai Docker va Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Bat dich vu Docker
  service:
    name: docker
    state: started
    enabled: true
