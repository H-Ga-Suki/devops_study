---
- name: Deploy cua hang microservices
  hosts: store
  become: true
  vars:
    store_project_dir: /home/azureuser/devops_study
  tasks:
    - name: Kiem tra file .env ton tai
      ansible.builtin.stat:
        path: "{{ store_project_dir }}/.env"
      register: env_file

    - name: Dung lai neu thieu .env
      ansible.builtin.fail:
        msg: "Thieu file .env trong {{ store_project_dir }}"
      when: not env_file.stat.exists

    - name: Chay docker compose up
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ store_project_dir }}"
      register: compose_out
      changed_when: "'Recreated' in compose_out.stderr or 'Created' in compose_out.stderr"
